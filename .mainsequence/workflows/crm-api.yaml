api_version: "3.0.0"
name: crm-api
resources:
  - key: crm
    kind: fastapi
    access:
      resources:
        - key: crm-assistant
          policy: user
      branches:
        - repository: MetaTables
          policy: reader
    spec:
      source_path: api/erp/crm/main.py
      mcp_enabled: true
      public_ingress:
        - method: GET
          path: /extensions/google/oauth/callback/
        - method: GET
          path: /extensions/google/oauth/done/
      cpu_request: "0.5"
      memory_request: 1Gi
      spot: false
      automatic_deployment: true
      automatic_redeployment:
        enabled: true
        tag_regex: '^v[0-9]+[.][0-9]+[.][0-9]+-erp-api$'
      revision_retention_count: 3

  - key: migrate-crm
    kind: job
    access:
      branches:
        - repository: MetaTables
          policy: reader
    spec:
      name: CRM migrations
      description: Reconciles provisioned ERP MetaTables providers before the ERP API and CRM assistant roll out.
      execution_path: jobs/erp/crm/migrate.py
      cpu_request: "0.5"
      memory_request: "1"
      max_runtime_seconds: 1800
      env_vars:
        - name: ERP_USER_PREFERENCES_DATA_SOURCE_UID
          value: "ebd9bc7f-5f11-42fa-8961-19e9e66e2196"
        - name: ERP_USER_PREFERENCES_PROVISIONED_MODULES
          value: "base,catalog,crm,sales,finance,projects,people,collaboration,marketing,inventory,purchasing,manufacturing,commerce,reporting"
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null

  - key: crm-assistant
    kind: harness_agent
    acts_for_requester: true
    access:
      resources:
        - key: crm
          policy: user
    spec:
      source_path: api/agents/crm/main.py
      mcp_applications:
        - resource: crm
      command_center_icon:
        path: assets/erp/crm/agent/sequence/assets/crm/neutral/idle.png
        rendering: color
        image_rendering: auto
      command_center_animations:
        poses:
          thinking: {path: assets/erp/crm/agent/sequence/assets/crm/neutral/thinking.png}
          working: {path: assets/erp/crm/agent/sequence/assets/crm/neutral/working.png}
          outreach: {path: assets/erp/crm/agent/sequence/assets/crm/neutral/working.png}
          error: {path: assets/erp/crm/agent/sequence/assets/crm/neutral/error.png}
        tools:
          - application: crm
            pose: outreach
      llm_provider: openai-codex
      llm_model: gpt-5.6-luna
      llm_thinking: medium
      automatic_deployment: true
      automatic_redeployment:
        enabled: true
        tag_regex: '^v[0-9]+[.][0-9]+[.][0-9]+-erp-api$'
      revision_retention_count: 3
      env_vars:
        - name: TAU_EXCLUDE_BASE_TOOLS
          value: "true"
        - name: TAU_EXCLUDE_MAINSEQUENCE_MCP
          value: "true"

# This branch push provisions storage. API and assistant promotion requires
# a matching release tag, while this Job is admitted by a push to main.
execution:
  steps:
    image:
      prepare_image: migrate-crm
    migrate:
      run_job: migrate-crm
      image_from: image
      needs: [image]
